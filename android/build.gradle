allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Set global properties that Flutter and its plugins (like jni) expect.
    // Setting these here ensures they are available during the evaluation of any subproject plugin.
    project.ext {
        compileSdkVersion = 36
        minSdkVersion = 24
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        versionCode = 1
        versionName = "1.0.0"
        flutter = [
            compileSdkVersion: 36,
            minSdkVersion: 24,
            targetSdkVersion: 34,
            ndkVersion: "25.1.8937393",
            versionCode: 1,
            versionName: "1.0.0"
        ]
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    // Configure Android settings as soon as the respective plugin is applied.
    // This is safer than afterEvaluate and avoids "already evaluated" errors.
    def configureAndroid = { p ->
        p.android {
            compileSdkVersion 36
            ndkVersion "25.1.8937393"
            
            if (p.android.hasProperty('defaultConfig')) {
                p.android.defaultConfig.minSdkVersion = 24
                p.android.defaultConfig.targetSdkVersion = 34
                p.android.defaultConfig.versionCode = 1
                p.android.defaultConfig.versionName = "1.0.0"
            }
        }
    }

    project.plugins.withId('com.android.application') { configureAndroid(project) }
    project.plugins.withId('com.android.library') { configureAndroid(project) }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
